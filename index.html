<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWIRLZY</title>
    <link rel="stylesheet" href="./css/main.css">
    <script src="./js/script.js" defer></script>
</head>
<body>

    <nav>
        <ul>
            <li><div id="logo">
                <div><h1>?</h1></div>
                <p>SWIRLZY</p>
            </div></li>
        </ul>
        <ul>
            <li><p>Life & News</p></li>
            <li><p>About</p></li>
            <li><p>Store</p></li>
            <li><p>Recipes</p></li>
        </ul>
        <ul>
            <li><div id="tag2">
                <div id="tagtext2">
                    <h1>CART</h1>
                </div>
            </div></li>
        </ul>
    </nav>


    <div class="wrapper">
        <div class="wrapperleft">
            <div id="sweet">
                <div id="sweetcookie">
                    <h1 id="sweeth1">SWEEEEEEEEET!</h1>
                    <img src="./img/cookies.png" alt="" id="cookies" draggable="false">
                    <div id="tag">
                        <div id="tagtext">
                            <p>FROM</p>
                            <h1>$12</h1>
                        </div>
                    </div>
                </div>
            </div>
            <div id="top-5">
                <div id="top-5text">
                    <h1 id="top-5h1">TOP-5 PICKS</h1>
                </div>
                <div id="top-5list">
                    <ol>
                        <li>1</li>
                        <li>2</li>
                    </ol>
                </div>
            </div>
        </div>

        <div class="wrapperright">
            <div id="school">
                <h1>SCHOOL</h1>
                <p>Learn to bake deliciously</p>
                <img src="./img/chef.png" alt="" draggable="false">
                <div id="schoolbar">
                    <div id="explore">
                        <h1>EXPLORE</h1>
                    </div>
                    <div id="rollingPin">

                    </div>
                </div>
            </div>

            <div id="everyday">
                <h1>EVERYDAY</h1>
                <img src="./img/pie.png" alt="" draggable="false">
                <p>Freshly baked, delivered daily right to your door!</p>
            </div>
        </div>
    </div>
</body>
</html>
